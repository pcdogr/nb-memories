<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Photo Gallery - Northern Beaches Memories</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #f5f0eb; color: #1a1a2e; line-height:1.6; }
  header { background: linear-gradient(135deg, #1a1a2e 0%, #2d2d4e 100%); color:white; padding:2rem; text-align:center; }
  header h1 { font-size:1.8rem; }
  header a { color:#c37d4a; text-decoration:none; font-size:0.9rem; }
  section { max-width:1100px; margin:1.5rem auto; padding:0 1rem; }
  
  .filters { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
  .filter-btn { padding:0.4rem 1rem; border:1px solid #c37d4a; border-radius:20px; background:white; color:#c37d4a; cursor:pointer; font-size:0.85rem; transition:all 0.2s; }
  .filter-btn:hover, .filter-btn.active { background:#c37d4a; color:white; }
  
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(480px,1fr)); gap:1.5rem; }
  .card { background:white; border-radius:14px; overflow:hidden; box-shadow:0 3px 15px rgba(0,0,0,0.07); transition:transform 0.2s; }
  .card:hover { transform:translateY(-3px); }
  .card img { width:100%; height:280px; object-fit:cover; display:block; }
  .card-body { padding:1.3rem; }
  .card h3 { font-size:1.05rem; margin-bottom:0.3rem; color:#1a1a2e; }
  .card .meta { font-size:0.8rem; color:#c37d4a; margin-bottom:0.3rem; }
  .card p { font-size:0.88rem; color:#666; line-height:1.5; }
  footer { text-align:center; padding:2rem; color:#999; font-size:0.82rem; }
  footer a { color:#c37d4a; text-decoration:none; }
  @media (max-width:700px) { .gallery { grid-template-columns:1fr; } }
  
  .compare-card .compare { display:grid; grid-template-columns:1fr 1fr; gap:0; }
  .compare-card .compare-img { position:relative; }
  .compare-card .compare-img img { width:100%; height:280px; object-fit:cover; display:block; }
  .compare-card .label { position:absolute; top:8px; left:8px; padding:3px 8px; border-radius:4px; font-size:0.7rem; font-weight:bold; letter-spacing:1px; }
  .compare-card .before { background:rgba(0,0,0,0.6); color:#fff; }
  .compare-card .after { background:rgba(195,125,74,0.85); color:#fff; }
  @media (max-width:550px) { .compare-card .compare { grid-template-columns:1fr; } }
  
  .lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; cursor:pointer; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:95vw; max-height:95vh; object-fit:contain; border-radius:4px; }
  .lightbox .close { position:absolute; top:20px; right:30px; color:#fff; font-size:2rem; cursor:pointer; opacity:0.8; }
  .lightbox .close:hover { opacity:1; }
  .lightbox .caption { position:absolute; bottom:20px; left:0; width:100%; text-align:center; color:#ccc; font-size:0.85rem; padding:1rem; }
  .card img:hover { cursor:pointer; opacity:0.95; }
</style>
</head>
<body>
<header>
  <h1>📸 All Restored Photos</h1>
  <p><a href="index.html">← Back to Home</a></p>
</header>
<section>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="1910s">1910s</button>
    <button class="filter-btn" data-filter="1920s">1920s</button>
    <button class="filter-btn" data-filter="1940s">1940s</button>
    <button class="filter-btn" data-filter="1950s">1950s</button>
    <button class="filter-btn" data-filter="1970s">1970s</button>
    <button class="filter-btn" data-filter="brookvale">Brookvale</button>
    <button class="filter-btn" data-filter="manly">Manly</button>
  </div>
  <div class="gallery" id="gallery">
    <!-- Photos loaded by JS -->
  </div>
</section>
<footer>
  Photos from <a href="https://northernbeaches.recollect.net.au/" target="_blank">Northern Beaches Council History Hub</a> · Site by Daisy 🌸
  <br><span style="font-size:0.75rem;color:#bbb;">Manly Library · Dee Why Library · Mona Vale Library</span>
</footer>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" src="">
  <div class="caption" id="lightbox-caption"></div>
</div>
<script>
const photos = [
  {id:'manly-beach-1912', title:'Manly Beach and Promenade', year:'1912', era:'1910s', loc:'manly', 
   before:'https://files.catbox.moe/js04ie.jpg', after:'https://files.catbox.moe/gm40cu.jpg',
   desc:'Edwardian elegance on Manly oceanfront promenade. The beach we know today, frozen in time a century ago.'},
  {id:'body-surfers-1926', title:'Body surfers at Manly Beach', year:'1926', era:'1920s', loc:'manly',
   before:'https://files.catbox.moe/s6onat.jpg', after:'https://files.catbox.moe/1ut11v.jpg',
   desc:'The birth of Australia\'s beach culture. Body surfers riding the Manly waves, captured nearly 100 years ago.'},
  {id:'manly-cove-1940s', title:'Manly Cove Wharf and Harbour Pool', year:'1940s', era:'1940s', loc:'manly',
   before:'https://files.catbox.moe/t570oj.jpg', after:'https://files.catbox.moe/2xj5tr.jpg',
   desc:'Steam ferries dock at the busy wharf as crowds pack the foreshore. A snapshot of post-war Manly.'},
  {id:'thomas-st-1950', title:'Thomas Street, North Manly', year:'1950', era:'1950s', loc:'manly',
   before:'https://files.catbox.moe/th84yp.jpg', after:'https://files.catbox.moe/xjpuq0.jpg',
   desc:'A sweeping view of mid-century Brookvale from the ridge of North Manly. Red-tiled suburban homes.'},
  {id:'old-pittwater-1910', title:'Old Pittwater Road, Brookvale', year:'1910', era:'1910s', loc:'brookvale',
   before:'https://files.catbox.moe/i2hlyf.jpg', after:'https://files.catbox.moe/rjvpha.jpg',
   desc:'A quiet country lane that once connected Brookvale to the wider Northern Beaches. Edwardian pastoral scene.'},
  {id:'marineland-1970s', title:'Marineland and the Dressing Pavilion', year:'1970s', era:'1970s', loc:'manly',
   before:'https://files.catbox.moe/sb5rua.jpg', after:'https://files.catbox.moe/dduh8r.jpg',
   desc:'A beloved Manly landmark from the seaside fun era. A piece of Manly history now long gone.'},
  {id:'north-steyne', title:'North Steyne Promenade, Manly', year:'?', era:'all', loc:'manly',
   img:'https://files.catbox.moe/jantna.jpg',
   desc:'Strolling along the iconic North Steyne shoreline, a favourite spot for locals and visitors alike.'},
  {id:'brookvale-hotel-1955', title:'Brookvale Hotel, 1955', year:'1955', era:'1950s', loc:'brookvale',
   img:'https://files.catbox.moe/s21a0e.jpg',
   desc:'The very first hotel in Brookvale, opened in March 1955. A landmark of the changing Northern Beaches.'},
  {id:'queenscliff', title:'Queenscliff Beach and Headland', year:'?', era:'all', loc:'manly',
   img:'https://files.catbox.moe/w9uccv.jpg',
   desc:'A view of the coast that shows how much — and how little — has changed over the decades.'},
  {id:'brookvale-house-1895', title:'Brookvale House', year:'1895', era:'1890s', loc:'brookvale',
   img:'https://files.catbox.moe/bho1yb.jpg',
   desc:'Brookvale Estate captured in the late 19th century, long before the suburb we know today existed.'}
];

function render(filter) {
  const el = document.getElementById('gallery');
  const filtered = filter === 'all' ? photos : photos.filter(p => p.era === filter || p.loc === filter);
  el.innerHTML = filtered.map(p => {
    if (p.before && p.after) {
      return `<div class="card compare-card" data-era="${p.era}" data-loc="${p.loc}">
        <div class="compare">
          <div class="compare-img">
            <span class="label before">BEFORE</span>
            <img src="${p.before}" alt="${p.title} - Original" loading="lazy">
          </div>
          <div class="compare-img">
            <span class="label after">AFTER</span>
            <img src="${p.after}" alt="${p.title} - Restored" loading="lazy">
          </div>
        </div>
        <div class="card-body">
          <h3>${p.title}, c ${p.year} ✨ Restored</h3>
          <div class="meta">${p.year} · ${p.loc === 'manly' ? 'Manly' : 'Brookvale'}</div>
          <p>${p.desc}</p>
        </div>
      </div>`;
    }
    return `<div class="card" data-era="${p.era}" data-loc="${p.loc}">
      <img src="${p.img}" alt="${p.title}" loading="lazy">
      <div class="card-body">
        <h3>${p.title}${p.year !== '?' ? ', c '+p.year : ''}</h3>
        <div class="meta">${p.year !== '?' ? p.year+' · ' : ''}${p.loc === 'manly' ? 'Manly' : 'Brookvale'}</div>
        <p>${p.desc}</p>
      </div>
    </div>`;
  }).join('');
  
  // Lightbox
  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = this.src;
      const card = this.closest('.card-body') || this.closest('.compare-img');
      let caption = this.alt || '';
      if (card) {
        const title = card.querySelector('h3');
        if (title) caption = title.innerText;
      }
      document.getElementById('lightbox-caption').innerText = caption;
      lb.classList.add('show');
    });
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    render(this.dataset.filter);
  });
});

function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });

render('all');
</script>
</body>
</html>
